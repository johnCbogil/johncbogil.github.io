<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Voices political tech startup website screenshots from 2016."
    >
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <title>Voices | John Bogil</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fff;
        --text: #000;
        --line: #000;
        --focus: #000;
        --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        line-height: 1.58;
        text-rendering: optimizeLegibility;
      }

      a {
        color: var(--text);
        overflow-wrap: anywhere;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.18em;
      }

      a:focus-visible {
        border-radius: 4px;
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      .page {
        width: calc(100% - 40px);
        max-width: 1120px;
        margin: 0 auto;
        padding: 46px 0 72px;
      }

      header {
        padding-bottom: 30px;
        border-bottom: 1px solid var(--line);
      }

      .back-link {
        display: inline-block;
        margin-bottom: 28px;
        font-size: 0.92rem;
        text-decoration: none;
      }

      h1 {
        max-width: 900px;
        margin: 0;
        font-size: 3rem;
        font-weight: 500;
        line-height: 1.08;
      }

      main {
        display: grid;
        gap: 28px;
        padding-top: 36px;
      }

      figure {
        margin: 0;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      @media (max-width: 660px) {
        .page {
          width: calc(100% - 28px);
          padding-top: 28px;
          padding-bottom: 48px;
        }

        header {
          padding-bottom: 26px;
        }

        h1 {
          font-size: 2rem;
        }

        main {
          gap: 18px;
          padding-top: 30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="back-link" href="../" target="_blank" rel="noopener noreferrer">&larr; Back</a>
        <h1>Voices: political tech startup, 2016, website reproduced below:</h1>
      </header>

      <main aria-label="Voices website screenshots">
        <figure>
          <img
            src="../assets/voices/voices-06.png"
            width="2000"
            height="1310"
            alt="Voices website screenshot showing the homepage with two mobile app screens."
          >
        </figure>
        <figure>
          <img
            src="../assets/voices/voices-05.png"
            width="2000"
            height="1249"
            alt="Voices website screenshot showing app download, League of Women Voters quote, and how it works heading."
          >
        </figure>
        <figure>
          <img
            src="../assets/voices/voices-04.png"
            width="2000"
            height="713"
            alt="Voices website screenshot showing step 1 and the Voices web dashboard navigation."
          >
        </figure>
        <figure>
          <img
            src="../assets/voices/voices-03.png"
            width="2000"
            height="606"
            alt="Voices website screenshot showing step 2 and a Jobs for America action interface."
          >
        </figure>
        <figure>
          <img
            src="../assets/voices/voices-02.png"
            width="2000"
            height="895"
            alt="Voices website screenshot showing step 3 and advocacy group data insight copy."
          >
        </figure>
        <figure>
          <img
            src="../assets/voices/voices-01.png"
            width="2000"
            height="900"
            alt="Voices website screenshot showing tweets from NOW-NYC and League of Women Voters of NYC."
          >
        </figure>
      </main>
    </div>
  </body>
</html>
