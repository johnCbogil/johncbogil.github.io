<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>John Bogil — social preview artwork</title>
    <style>
      * { box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        padding: 24px;
        background: #fff;
        color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .preview {
        display: grid;
        grid-template-rows: 88px 1fr 88px;
        height: 100%;
        border: 1px solid #000;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 36px;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 18px;
      }

      header { border-bottom: 1px solid #000; }

      .identity {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .mark {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        background: #000;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }

      .label {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      main {
        display: grid;
        grid-template-columns: 1.65fr 1fr;
        min-height: 0;
      }

      .name {
        display: flex;
        align-items: center;
        padding: 26px 40px 40px;
      }

      h1 {
        margin: 0;
        font-size: 154px;
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 0.88;
      }

      .details {
        display: grid;
        grid-template-rows: repeat(3, 1fr);
        margin: 0;
        background: #000;
        color: #fff;
      }

      .details div {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 20px 32px;
      }

      .details div + div { border-top: 1px solid #fff; }

      dd {
        margin: 0;
        font-size: 31px;
        letter-spacing: -0.025em;
        line-height: 1.1;
      }

      footer { border-top: 1px solid #000; }

      .contents {
        display: flex;
        gap: 34px;
      }
    </style>
  </head>
  <body>
    <div class="preview">
      <header>
        <div class="identity"><span class="mark">JB</span><span class="label">Personal website</span></div>
        <span class="label">Writing &amp; building</span>
      </header>
      <main>
        <div class="name"><h1>John<br>Bogil</h1></div>
        <dl class="details">
          <div><dt class="label">Work</dt><dd>Startup founder</dd></div>
          <div><dt class="label">Focus</dt><dd>Climate solutions</dd></div>
          <div><dt class="label">Home</dt><dd>Brooklyn</dd></div>
        </dl>
      </main>
      <footer>
        <span>johnbogil.com</span>
        <div class="contents label"><span>Writing</span><span>Works</span><span>Contact</span></div>
      </footer>
    </div>
  </body>
</html>
